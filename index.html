var newC=0;
function addSheet(){
 var ds=Sel.y+"-"+pad(Sel.m+1)+"-"+pad(Sel.d);
 sheet('<div class="sh"><span>Yeni özel gün</span><button class="ib" data-cl="1"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sl">Ad</div><input class="in" id="fn" placeholder="Doğum günü, yıl dönümü, randevu…" maxlength="60"><div class="sl">Tarih</div><input class="in" type="date" id="fd" value="'+ds+'"><div class="rp"><span>Her yıl tekrarla</span><button class="opt sel" id="fr" style="padding:8px 18px">Evet</button></div><div class="sl">Renk</div><div class="sw" id="uc"></div><button class="save" id="sv">Kaydet</button>');
 var u=$("uc");for(var i=0;i<UC.length;i++){var b=document.createElement("button");b.style.background=UC[i];b.setAttribute("data-uc",i);b.className=i===newC?"sel":"";u.appendChild(b)}
}
function setSheet(){
 var h='<div class="sh"><span>Ayarlar</span><button class="ib" data-cl="1"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sl">Gösterilecek günler</div><div class="opts">';
 for(var k in TL)h+='<button class="opt'+(cfg.f[k]!==0?" sel":"")+'" data-f="'+k+'">'+TL[k]+"</button>";
 h+='</div><div class="sl">Renk</div><div class="sw">';
 for(var c=0;c<COL.length;c++)h+='<button data-c="'+c+'" class="'+(c===cfg.ci?"sel":"")+'" style="background:'+COL[c][1]+'"></button>';
 h+='</div><div class="sl">Arka plan</div><div class="sw" id="sb">';
 for(var m=0;m<BG.length;m++)h+='<button data-b="'+m+'" title="'+BG[m][0]+'" class="'+(m===cfg.bi?"sel":"")+'" style="background:'+BG[m][1]+'"></button>';
 h+='</div><div class="sl">Tam ekran</div><button class="opt sel" id="fs" style="width:100%">Tam ekran aç / kapat</button>';
 sheet(h);
}
function apply(){var rs=document.documentElement.style;rs.setProperty("--ac",COL[cfg.ci][0]);rs.setProperty("--bg",BG[cfg.bi][1])}
var rep=true;
document.addEventListener("click",function(e){
 var t=e.target.closest&&e.target.closest("button,.ev");if(e.target.id==="ov"){$("ov").className="ov";return}
 if(!t)return;var id=t.id;
 if(id==="pv")go(-1);else if(id==="nx")go(1);
 else if(id==="ad"){rep=true;addSheet()}else if(id==="st")setSheet();
 else if(t.hasAttribute("data-cl"))$("ov").className="ov";
 else if(id==="fs"){var d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(x){}}
 else if(id==="fr"){rep=!rep;t.innerHTML=rep?"Evet":"Hayır";t.className="opt"+(rep?" sel":"")}
 else if(t.hasAttribute("data-uc")){newC=+t.getAttribute("data-uc");var s=$("uc").children;for(var i=0;i<s.length;i++)s[i].className=i===newC?"sel":""}
 else if(id==="sv"){var nm=$("fn").value.replace(/[<>&"]/g,"").trim(),dv=$("fd").value;if(!nm||!dv){$("fn").style.borderColor="#ff82b4";return}
  var p=dv.split("-");U.push({id:"u"+Date.now(),n:nm,y:+p[0],m:+p[1],d:+p[2],rep:rep,c:UC[newC]});save();Sel={y:+p[0],m:+p[1]-1,d:+p[2]};V={y:Sel.y,m:Sel.m};$("ov").className="ov";render(0)}
 else if(t.hasAttribute("data-x")){var xi=t.getAttribute("data-x");U=U.filter(function(u){return u.id!==xi});save();render(0)}
 else if(t.hasAttribute("data-f")){var k=t.getAttribute("data-f");cfg.f[k]=cfg.f[k]===0?1:0;save();setSheet();render(0)}
 else if(t.hasAttribute("data-c")){cfg.ci=+t.getAttribute("data-c");save();apply();setSheet()}
 else if(t.hasAttribute("data-b")){cfg.bi=+t.getAttribute("data-b");save();apply();setSheet()}
 else if(t.hasAttribute("data-k")){var p2=t.getAttribute("data-k").split("-"),dr=(+p2[0]*12+ +p2[1])-(V.y*12+V.m);Sel={y:+p2[0],m:+p2[1],d:+p2[2]};V={y:Sel.y,m:Sel.m};render(dr)}
});
$("mo").addEventListener("click",function(){var n=new Date();Sel={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};var dr=(Sel.y*12+Sel.m)-(V.y*12+V.m);V={y:Sel.y,m:Sel.m};render(dr>0?1:(dr<0?-1:0))});
var ld=now.getDate();setInterval(function(){var n=new Date();if(n.getDate()!==ld){ld=n.getDate();render(0)}},30000);
apply();render(0);
</script>
</body>
</html>
